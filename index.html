<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海龜湯 · 詭案筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05050a;
  --ink:#0a0912;
  --panel:rgba(19,16,32,.72);
  --rose:#ff2d7e;
  --cyan:#3df0ff;
  --lime:#a6ff4d;
  --amber:#ffb03a;
  --violet:#a06bff;
  --muted:#7d76a0;
  --line:rgba(125,115,180,.26);
  --serif:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --mono:"Share Tech Mono","Courier New",monospace;
  --bulb:30px;   /* 愛心的上限；格子比它寬時就置中，窄時愛心跟著縮 */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:#d9d4ee;
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
}

/* ── 夜巷氛圍 ─────────────────────── */
body::before{
  content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(50% 40% at 12% 8%, rgba(255,45,126,.16), transparent 70%),
    radial-gradient(45% 45% at 88% 22%, rgba(61,240,255,.12), transparent 70%),
    radial-gradient(60% 50% at 50% 105%, rgba(160,107,255,.14), transparent 70%),
    var(--ink);
  animation:drift 26s ease-in-out infinite alternate;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
@keyframes drift{from{transform:translate3d(-1.5%,-1%,0) scale(1.02)}to{transform:translate3d(1.5%,1.5%,0) scale(1.06)}}

.alley{max-width:1220px;margin:0 auto;padding:clamp(14px,2.4vw,24px) clamp(12px,2.4vw,22px) clamp(18px,3vw,30px)}

/* ── 招牌 ─────────────────────── */
.sign{text-align:center;margin-bottom:clamp(14px,2.6vw,22px)}
.eyebrow{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.38em;
  color:var(--cyan);text-transform:uppercase;margin:0 0 6px;
  text-shadow:0 0 8px rgba(61,240,255,.8);padding-left:.42em;
}
h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(2rem,7vw,3.1rem);
  letter-spacing:.16em;margin:0;padding-left:.16em;line-height:1.15;
  color:#fff2f7;
  text-shadow:
    0 0 4px #fff,
    0 0 10px var(--rose),
    0 0 24px var(--rose),
    0 0 52px rgba(255,45,126,.65),
    0 0 90px rgba(255,45,126,.3);
  animation:ignite 4.5s 1 both, hum 5s 4.5s ease-in-out infinite;
}
h1 .dim{
  animation:deadtube 7s 5s infinite;
}
@keyframes ignite{
  0%,8%{opacity:.15}9%{opacity:.9}11%{opacity:.2}
  14%{opacity:1}17%{opacity:.25}19%{opacity:.95}
  22%{opacity:.3}26%{opacity:1}30%{opacity:.6}34%{opacity:1}
}
@keyframes hum{0%,100%{filter:brightness(1)}50%{filter:brightness(1.13)}}
@keyframes deadtube{
  0%,52%,100%{opacity:1;filter:none}
  53%{opacity:.35;filter:saturate(.2)}
  55%{opacity:1}
  56.5%{opacity:.3;filter:saturate(.2)}
  58%{opacity:1}
}

/* ── 區塊 ─────────────────────── */
.panel{
  position:relative;background:var(--panel);
  border:1px solid var(--line);border-radius:2px;
  padding:clamp(12px,2.2vw,18px);
  backdrop-filter:blur(2px);
  box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.55);
}
.stage{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  gap:14px;align-items:stretch;
}
.col{display:flex;flex-direction:column;gap:14px}
/* 兩欄等高：提問卡吃掉左欄多餘空間，湯底吃掉右欄多餘空間 */
.p-quiz{flex:1;min-height:0}
.p-bottom{flex:1;min-height:0;display:flex;flex-direction:column}
.p-bottom textarea{flex:1}
.panel-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:10px;
}
h2{
  font-family:var(--serif);font-weight:900;font-size:1.1rem;
  letter-spacing:.2em;margin:0;padding-left:.2em;
}
.h-cyan{color:#e8fdff;text-shadow:0 0 6px var(--cyan),0 0 22px rgba(61,240,255,.65)}
.h-violet{color:#f3ecff;text-shadow:0 0 6px var(--violet),0 0 22px rgba(160,107,255,.6)}
.h-amber{color:#fff5e4;text-shadow:0 0 6px var(--amber),0 0 22px rgba(255,176,58,.55)}
.hint{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;color:var(--muted)}

/* ── 生命 ─────────────────────── */
.lifebar{display:block}
.bulbs{
  /* 一排十顆，十格平分整條的寬度，最後一顆剛好落在右邊界 */
  display:grid;grid-template-columns:repeat(10,minmax(0,1fr));
  gap:6px;
}
.bulb{
  width:100%;max-width:var(--bulb);aspect-ratio:1;justify-self:center;
  display:block;color:var(--rose);
  filter:drop-shadow(0 0 3px var(--rose)) drop-shadow(0 0 9px rgba(255,45,126,.7));
  transition:color .35s,filter .35s;
}
.bulb path{fill:currentColor}
.bulb.spent{color:#241f33;filter:none}
.bulb.last{animation:dying 1.6s infinite}
@keyframes dying{0%,100%{opacity:1}42%{opacity:.25}46%{opacity:1}58%{opacity:.2}62%{opacity:1}}
.tally{
  display:block;text-align:right;margin-top:10px;
  font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;
  color:var(--muted);white-space:nowrap;
}
.tally b{color:var(--rose);font-weight:400;text-shadow:0 0 10px rgba(255,45,126,.9)}
.tally.out b{color:#4a4360;text-shadow:none}

/* 分母就是生命總數，本身是一個輸入框。沒在編輯時必須跟旁邊的純文字分不出來：
   字體、字距、顏色一律繼承，沒有框線、沒有底色、沒有內距，寬度由 sizeCount() 照位數量出來。 */
.denom{position:relative;display:inline-block}
.ghost{position:absolute;left:0;top:0;visibility:hidden;white-space:pre}
.tally input.count{
  width:1ch;padding:0;margin:0;border:0;border-radius:0;background:none;
  font:inherit;letter-spacing:inherit;color:inherit;text-align:right;
  cursor:text;transition:box-shadow .2s,color .2s,text-shadow .2s;
}
/* 底線用 inset 陰影畫，加框線會把後面的字推開，一滑過去就露餡了 */
.denom:hover input.count:not(:focus){box-shadow:inset 0 -1px 0 rgba(61,240,255,.35)}
.tally input.count::selection{background:rgba(61,240,255,.28);color:#eafcff}
.tally input.count:focus,.tally input.count:focus-visible{
  outline:none;color:#eafcff;
  box-shadow:inset 0 -1px 0 var(--cyan);
  text-shadow:0 0 10px var(--cyan);
}
/* 上下鍵平常完全不存在，滑過或游標進到分母才浮出來 */
.nudge{
  position:absolute;left:100%;top:50%;transform:translateY(-50%);
  margin-left:1px;display:flex;flex-direction:column;
  opacity:0;transition:opacity .15s;
}
.nudge:hover,.tally:hover .nudge,.denom:focus-within .nudge{opacity:1}
.nudge button{
  width:11px;height:10px;padding:0;border:0;background:transparent;
  color:var(--muted);font-size:9px;line-height:10px;cursor:pointer;
}
.nudge button:hover:not(:disabled){color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.nudge button:disabled{color:#332e47;cursor:not-allowed}

/* ── 輸入 ─────────────────────── */
textarea,input,select{font-family:inherit;color:#e6e2f7}
textarea,input{
  width:100%;background:rgba(5,5,12,.6);
  border:1px solid var(--line);border-radius:2px;
  padding:12px 14px;font-size:1rem;line-height:1.75;
  transition:border-color .2s,box-shadow .2s;
}
/* 高度由內容決定（見下方的 fit），這裡只給下限 */
textarea{resize:none;overflow:hidden;min-height:110px}
#bottom{min-height:130px}
textarea::placeholder,input::placeholder{color:#4f4869}
textarea:focus,input:focus,select:focus{
  outline:none;border-color:var(--cyan);
  box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(61,240,255,.28),inset 0 0 22px rgba(61,240,255,.06);
}
#bottom:focus{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 18px rgba(255,176,58,.28)}

/* ── 提問列 ─────────────────────── */
ol.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qrow{
  display:grid;
  grid-template-columns:1.4rem minmax(0,1.6fr) 5.3rem minmax(0,1fr);
  gap:6px;align-items:stretch;
}
/* 提問與註解是會換行的 textarea，高度交給 fit()，不留下限 */
.qrow textarea{display:block;min-height:0;height:auto}
.qrow .qtext,.qrow .qnote{padding:5px 10px;font-size:.9rem;line-height:1.5}
.qrow .qnote{
  background:rgba(5,5,12,.35);border-color:rgba(160,107,255,.2);
  color:#b9b1d8;font-size:.84rem;
}
.qrow .qnote::placeholder{color:#453e60}
.qrow .qnote:focus{
  border-color:var(--violet);
  box-shadow:0 0 0 1px var(--violet),0 0 16px rgba(160,107,255,.26),inset 0 0 20px rgba(160,107,255,.06);
}
.qnum{
  display:flex;align-items:center;justify-content:flex-end;
  font-family:var(--mono);font-size:.8rem;color:#4f4869;
  transition:color .2s,text-shadow .2s;
}
.qrow.filled .qnum{color:var(--cyan);text-shadow:0 0 10px rgba(61,240,255,.8)}
.sel{position:relative;display:flex}
.sel::after{
  content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);
  pointer-events:none;font-size:.7rem;color:var(--muted);
}
.sel select{
  width:100%;height:100%;appearance:none;-webkit-appearance:none;
  background:rgba(5,5,12,.6);border:1px solid var(--line);border-radius:2px;
  padding:5px 19px 5px 9px;font-size:.82rem;cursor:pointer;
  font-family:var(--mono);letter-spacing:.04em;color:#4f4869;
  transition:border-color .2s,box-shadow .2s,color .2s;
}
.sel select option{background:#12101c;color:#e6e2f7;font-family:var(--sans)}
.sel[data-a="T"] select{color:var(--lime);border-color:rgba(166,255,77,.55);box-shadow:0 0 12px rgba(166,255,77,.2)}
.sel[data-a="F"] select{color:var(--rose);border-color:rgba(255,45,126,.55);box-shadow:0 0 12px rgba(255,45,126,.2)}
.sel[data-a="I"] select{color:var(--amber);border-color:rgba(255,176,58,.55);box-shadow:0 0 12px rgba(255,176,58,.2)}
.stash{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--amber);margin:14px 0 0;opacity:.85}
.stash:empty{display:none}

/* ── 清空 ─────────────────────── */
.footer{text-align:right;margin-top:14px}
.wipe{
  font-family:var(--serif);font-weight:600;font-size:.78rem;letter-spacing:.2em;
  background:transparent;color:var(--rose);
  border:1px solid rgba(255,45,126,.45);border-radius:2px;
  padding:7px 16px 7px calc(16px + .2em);cursor:pointer;transition:.2s;
}
.wipe:hover{background:rgba(255,45,126,.1);box-shadow:0 0 22px rgba(255,45,126,.35);text-shadow:0 0 10px var(--rose)}

/* ── 提示 ─────────────────────── */
.veil{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(3,3,8,.86);backdrop-filter:blur(5px);
}
.veil.open{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.card{
  max-width:400px;width:100%;background:#0d0b16;
  border:1px solid var(--line);border-radius:2px;
  padding:32px 28px 26px;text-align:center;
  box-shadow:0 0 60px rgba(0,0,0,.9);
}
.card h3{
  font-family:var(--serif);font-weight:900;font-size:1.75rem;
  letter-spacing:.18em;margin:0 0 14px;padding-left:.18em;color:#fff2f7;
  text-shadow:0 0 6px var(--rose),0 0 26px rgba(255,45,126,.75);
  animation:ignite 2.2s 1 both;
}
.card p{font-size:.92rem;color:#a8a1c4;margin:0 0 24px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{
  font-family:var(--sans);font-size:.88rem;letter-spacing:.1em;
  padding:11px 20px;border-radius:2px;cursor:pointer;transition:.2s;
  background:transparent;border:1px solid var(--line);color:#c9c3e2;
}
.acts button:hover{border-color:var(--cyan);color:#eafcff;box-shadow:0 0 16px rgba(61,240,255,.25)}
.acts button.danger{color:var(--rose);border-color:rgba(255,45,126,.5)}
.acts button.danger:hover{border-color:var(--rose);box-shadow:0 0 18px rgba(255,45,126,.35)}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

@media (max-width:1000px){
  .stage{grid-template-columns:1fr}
  .col{display:contents}
  .p-life{order:1}
  .p-surface{order:2}
  .p-quiz{order:3}
  .p-bottom{order:4}
}
@media (max-width:640px){
  .qrow{grid-template-columns:1.2rem 1fr 4.9rem;gap:6px 5px}
  .qrow .qtext,.qrow .qnote{padding:5px 8px;font-size:.85rem}
  .qrow .qnote{grid-column:2 / -1;font-size:.8rem}
  .sel select{padding:5px 17px 5px 7px;font-size:.76rem}
  ol.qlist{gap:15px}
  .bulbs{gap:5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<main class="alley">

  <header class="sign">
    <p class="eyebrow">Lateral · Soup · Log</p>
    <h1>海龜<span class="dim">湯</span></h1>
  </header>

  <div class="stage">

    <div class="col col-left">
      <section class="panel p-quiz">
        <div class="panel-head">
          <h2 class="h-violet">提問紀錄</h2>
        </div>
        <ol class="qlist" id="qlist"></ol>
        <p class="stash" id="stash"></p>
      </section>
    </div>

    <div class="col col-right">
      <section class="panel p-life">
        <div class="panel-head">
          <h2 class="h-cyan">生命</h2>
        </div>
        <div class="lifebar">
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>
          <span class="tally" id="tally"><span aria-live="polite">剩 <b id="left">6</b></span> / <span class="denom"><span class="ghost" id="ghost" aria-hidden="true">6</span><input id="count" class="count" type="text" inputmode="numeric" autocomplete="off" maxlength="3" value="6" aria-label="生命總數，可直接輸入"><span class="nudge"><button id="plus" type="button" aria-label="增加生命">▴</button><button id="minus" type="button" aria-label="減少生命">▾</button></span></span></span>
        </div>
      </section>

      <section class="panel p-surface">
        <div class="panel-head">
          <h2 class="h-cyan">湯麵</h2>
        </div>
        <textarea id="surface" placeholder="輸入謎題"></textarea>
      </section>

      <section class="panel p-bottom">
        <div class="panel-head">
          <h2 class="h-amber">湯底</h2>
        </div>
        <textarea id="bottom" placeholder="尚未解答"></textarea>
      </section>
    </div>

  </div>

  <div class="footer">
    <button class="wipe" id="wipe" type="button">全部清空</button>
  </div>

</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="ctitle">
  <div class="card">
    <h3 id="ctitle"></h3>
    <p id="ctext"></p>
    <div class="acts" id="cacts"></div>
  </div>
</div>

<script>
(function(){
  const MIN = 1, MAX = 999;   // 沒有實質上限，999 只是防止手滑輸入天文數字把頁面卡住
  const state = { lives: 6, rows: [] };
  let announced = false;

  const $ = id => document.getElementById(id);
  const qlist = $('qlist'), bulbs = $('bulbs'), tally = $('tally'),
        count = $('count'), leftNum = $('left'), ghost = $('ghost'), stash = $('stash'),
        veil = $('veil'), ctitle = $('ctitle'), ctext = $('ctext'), cacts = $('cacts');

  const pad = n => String(n).padStart(2,'0');
  // 用掉生命的條件：問了問題或收到回答。只寫註解不算。
  const alive = r => !!(r && (r.q.trim() || r.a));
  // 有任何內容（含註解），用來判斷收起來的列是否還存著東西。
  const hasAny = r => !!(r && (r.q.trim() || r.a || r.n.trim()));

  function grow(){ while(state.rows.length < state.lives) state.rows.push({q:'',a:'',n:''}); }
  function used(){ return state.rows.slice(0, state.lives).filter(alive).length; }

  /* ── 輸入框跟著內容長高 ──────────────
     長問題要看得到全文，短問題不該佔一整塊，所以高度由內容決定。
     寫的是 min-height 不是 height：湯底那格還要能被 flex:1 撐滿右欄。 */
  const floorOf = new WeakMap();
  function fit(el){
    if(!el) return;
    if(!floorOf.has(el)) floorOf.set(el, parseFloat(getComputedStyle(el).minHeight) || 0);
    const st = el.style;
    st.minHeight = '0px';
    st.height = 'auto';
    // 不先解掉 flex:1 與 grid 的 stretch，量到的會是被撐開的高度，而不是內容高度
    st.flex = '0 0 auto';
    st.alignSelf = 'start';
    const h = el.scrollHeight + el.offsetHeight - el.clientHeight;   // 加回上下框線
    st.alignSelf = '';
    st.flex = '';
    st.height = '';
    st.minHeight = Math.max(h, floorOf.get(el)) + 'px';
  }
  function fitAll(){
    fit($('surface')); fit($('bottom'));
    qlist.querySelectorAll('textarea').forEach(fit);
  }
  // 盯的是版面寬度而不是視窗：內容一長，捲軸就出現，可用寬度少掉十幾像素、
  // 換行位置整個變掉，而捲軸的出現並不會觸發 resize。
  let lastW = 0, refitting = false;
  function refit(){
    if(refitting) return;
    refitting = true;
    requestAnimationFrame(() => {
      refitting = false;
      const w = document.documentElement.clientWidth;
      if(w === lastW) return;
      lastW = w;
      fitAll();
    });
  }
  window.addEventListener('resize', refit);
  if(window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);
  // 字體是後來才載入的，載入前量到的是備援字體的高度
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitAll(); sizeCount(); });

  function drawRows(){
    grow();
    qlist.innerHTML = '';
    for(let i = 0; i < state.lives; i++){
      const r = state.rows[i];
      const li = document.createElement('li');
      li.className = 'qrow' + (alive(r) ? ' filled' : '');
      li.dataset.i = i;
      li.innerHTML =
        '<span class="qnum">'+pad(i+1)+'</span>' +
        '<textarea class="qtext" rows="1" placeholder="第 '+(i+1)+' 個問題…" aria-label="第 '+(i+1)+' 個問題"></textarea>' +
        '<span class="sel" data-a="'+r.a+'">' +
          '<select aria-label="第 '+(i+1)+' 題的回答">' +
            '<option value="">— 未答</option>' +
            '<option value="T">T 是</option>' +
            '<option value="F">F 否</option>' +
            '<option value="I">I 無關</option>' +
          '</select>' +
        '</span>' +
        '<textarea class="qnote" rows="1" placeholder="註解" aria-label="第 '+(i+1)+' 題的註解"></textarea>';
      li.querySelector('.qtext').value = r.q;
      li.querySelector('.qnote').value = r.n;
      li.querySelector('select').value = r.a;
      qlist.appendChild(li);
      fit(li.querySelector('.qtext')); fit(li.querySelector('.qnote'));
    }
  }

  // 分母是輸入框，沒在編輯時要跟純文字分不出來，所以寬度得剛好等於那幾個數字
  function sizeCount(){
    ghost.textContent = count.value || '0';
    count.style.width = ghost.getBoundingClientRect().width + 'px';
  }

  function drawStatus(){
    const u = used(), left = state.lives - u;
    if(document.activeElement !== count) count.value = state.lives;
    sizeCount();
    $('minus').disabled = state.lives <= MIN;
    $('plus').disabled  = state.lives >= MAX;

    const HEART = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 '
                + '3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 '
                + '6.86-8.55 11.54L12 21.35z';
    bulbs.innerHTML = '';
    for(let i = 0; i < state.lives; i++){
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24');
      svg.setAttribute('class','bulb' + (i < u ? ' spent' : (left === 1 ? ' last' : '')));
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', HEART);
      svg.appendChild(p);
      bulbs.appendChild(svg);
    }

    // 這一段不重建，分母的輸入框正在裡面，重建會把游標踢掉
    tally.className = 'tally' + (left === 0 ? ' out' : '');
    leftNum.textContent = left;

    const hidden = state.rows.slice(state.lives).filter(hasAny).length;
    stash.textContent = hidden ? '另有 ' + hidden + ' 列被收起，內容還在，加回生命就會出現。' : '';

    // 正在輸入生命數時先不打斷，等離開欄位、數字確定了再提示
    if(left === 0 && !announced && document.activeElement !== count){ announced = true; outOfLives(); }
    if(left > 0) announced = false;
  }

  qlist.addEventListener('input', e => {
    const li = e.target.closest('.qrow');
    if(!li) return;
    fit(e.target);
    const r = state.rows[+li.dataset.i];
    if(e.target.classList.contains('qtext'))      r.q = e.target.value;
    else if(e.target.classList.contains('qnote')) { r.n = e.target.value; return; }
    else return;
    li.classList.toggle('filled', alive(r));
    drawStatus();
  });

  qlist.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    if(!e.target.classList.contains('qtext') && !e.target.classList.contains('qnote')) return;
    e.preventDefault();
    e.target.blur();
  });

  qlist.addEventListener('change', e => {
    if(e.target.tagName !== 'SELECT') return;
    const li = e.target.closest('.qrow');
    const r = state.rows[+li.dataset.i];
    r.a = e.target.value;
    li.querySelector('.sel').dataset.a = e.target.value;
    li.classList.toggle('filled', alive(r));
    drawStatus();
  });

  function setLives(n){
    state.lives = Math.min(MAX, Math.max(MIN, n));
    drawRows(); drawStatus();
  }
  // 上下鍵與鍵盤共用：欄位正在編輯時 drawStatus 不會覆蓋它，值與寬度要自己補
  function bump(d){
    setLives(state.lives + d);
    count.value = state.lives;
    sizeCount();
  }
  $('minus').onclick = () => bump(-1);
  $('plus').onclick  = () => bump(1);

  count.addEventListener('input', () => {
    const digits = count.value.replace(/\D/g, '');
    if(digits !== count.value) count.value = digits;
    sizeCount();
    const n = parseInt(digits, 10);
    // 打到一半的數字（空的、0、超出上限）先不動，等離開欄位再收斂
    if(!isNaN(n) && n >= MIN && n <= MAX && n !== state.lives) setLives(n);
  });
  count.addEventListener('blur', () => {
    const n = parseInt(count.value, 10);
    if(!isNaN(n)) setLives(n);
    count.value = state.lives;
    sizeCount();
    drawStatus();   // 離開欄位才判斷生命是否已經用光
  });
  count.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); count.blur(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); bump(1); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); bump(-1); }
  });
  count.addEventListener('focus', () => count.select());

  $('surface').addEventListener('input', e => fit(e.target));
  $('bottom').addEventListener('input', e => fit(e.target));

  /* ── 提示視窗 ── */
  let lastFocus = null;
  function ask(title, text, actions){
    lastFocus = document.activeElement;
    ctitle.textContent = title;
    ctext.textContent = text;
    cacts.innerHTML = '';
    actions.forEach(a => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = a.label;
      if(a.danger) btn.className = 'danger';
      btn.onclick = () => { close(); a.run && a.run(); };
      cacts.appendChild(btn);
    });
    veil.classList.add('open');
    cacts.firstChild.focus();
  }
  function close(){
    veil.classList.remove('open');
    if(lastFocus) lastFocus.focus();
  }
  veil.addEventListener('click', e => { if(e.target === veil) close(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && veil.classList.contains('open')) close(); });

  function outOfLives(){
    ask('燈全滅了',
        '生命已經用完。',
        [
          { label:'加開一條生命', run: () => setLives(state.lives + 1) },
          { label:'知道了' }
        ]);
  }

  $('wipe').onclick = () => {
    const n = used();
    ask('要清空整鍋湯嗎',
        '湯麵、湯底' + (n ? '和 ' + n + ' 則提問' : '') + '都會消失。',
        [
          { label:'全部清空', danger:true, run(){
              $('surface').value = '';
              $('bottom').value = '';
              state.rows = [];
              announced = false;
              drawRows(); drawStatus(); fitAll();
              $('surface').focus();
          }},
          { label:'留著' }
        ]);
  };

  drawRows(); drawStatus(); fitAll();
})();
</script>
</body>
</html>
