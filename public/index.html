<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>海龜湯 · 詭案筆記</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<main class="alley">

  <header class="sign">
    <p class="eyebrow">Lateral · Soup · Log</p>
    <h1>海龜<span class="dim">湯</span></h1>
  </header>

  <div class="stage">

    <div class="col col-left">
      <section class="panel p-quiz">
        <div class="panel-head">
          <h2 class="h-violet">提問紀錄</h2>
        </div>
        <ol class="qlist" id="qlist"></ol>
        <p class="stash" id="stash"></p>
      </section>
    </div>

    <div class="col col-right">
      <section class="panel p-life">
        <div class="panel-head">
          <h2 class="h-cyan">生命</h2>
        </div>
        <div class="lifebar">
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>
          <span class="tally" id="tally"><span aria-live="polite">剩 <b id="left">6</b></span> / <span class="denom"><span class="ghost" id="ghost" aria-hidden="true">6</span><input id="count" class="count" type="text" inputmode="numeric" autocomplete="off" maxlength="3" value="6" aria-label="生命總數，可直接輸入"><span class="nudge"><button id="plus" type="button" aria-label="增加生命">▴</button><button id="minus" type="button" aria-label="減少生命">▾</button></span></span></span>
        </div>
      </section>

      <section class="panel p-surface">
        <div class="panel-head">
          <h2 class="h-cyan">湯麵</h2>
        </div>
        <textarea id="surface" maxlength="2000" placeholder="輸入謎題"></textarea>
      </section>

      <section class="panel p-bottom">
        <div class="panel-head">
          <h2 class="h-amber">湯底</h2>
        </div>
        <textarea id="bottom" maxlength="4000" placeholder="尚未解答"></textarea>
      </section>
    </div>

  </div>

  <div class="footer">
    <button class="wipe" id="wipe" type="button">全部清空</button>
  </div>

</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="ctitle">
  <div class="card">
    <h3 id="ctitle"></h3>
    <p id="ctext"></p>
    <div class="acts" id="cacts"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
